[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concierge-langgraph-mlops"
version = "0.1.0"
description = "Agentic-RAG hospitality concierge on LangGraph with an MLOps + hyperparameter-optimization lifecycle"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shawn Becker", email = "shawn.becker@spexture.com" }]
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pydantic>=2.0",
    "mlflow>=3.0",
    "optuna>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
snowflake = ["snowflake-snowpark-python>=1.20", "snowflake>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
